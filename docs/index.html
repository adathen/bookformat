<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小書轉換器 — PDF 轉小書格式 PDF</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<header>
  <h1>📖 小書轉換器</h1>
  <p class="subtitle">上傳已排好版的 .pdf（一頁對應書的一頁），自動輸出可對摺裝訂的小書格式 PDF — 全部在您的瀏覽器內完成，檔案不會上傳到任何伺服器。</p>
</header>

<main>
  <section id="upload-section" class="card">
    <div id="dropzone" class="dropzone">
      <p>拖曳 .pdf 檔案到這裡，或</p>
      <label class="btn">
        選擇檔案
        <input type="file" id="fileInput" accept=".pdf" hidden>
      </label>
      <p class="hint-inline">
        請先在 Word／LibreOffice 把書的內容另存新檔為 PDF（一頁對應書的一頁），再把那份 PDF 上傳到這裡。
      </p>
      <p id="fileName" class="filename"></p>
    </div>
  </section>

  <section id="status-section" class="card" hidden>
    <div class="status-row">
      <div class="spinner" id="spinner"></div>
      <p id="statusText">處理中...</p>
    </div>
    <progress id="progressBar" max="100" value="0"></progress>
  </section>

  <section id="result-section" class="card" hidden>
    <h2>完成！</h2>
    <p id="resultText"></p>
    <a id="downloadLink" class="btn primary" download>下載小書格式 PDF</a>
    <button id="restartBtn" class="btn">重新上傳另一份檔案</button>
  </section>

  <section id="error-section" class="card error" hidden>
    <h2>發生問題</h2>
    <p id="errorText"></p>
    <button id="errorRestartBtn" class="btn">重新開始</button>
  </section>
</main>

<footer>
  <p>印刷建議：雙面列印（長邊翻頁 / flip on long edge）、A4 紙，印完後沿中線對摺、依序疊好，騎馬釘裝訂即完成。</p>
</footer>

<script src="js/pdfImposer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
